name: 编译社工站 APK（极简版·免 SDK 下载）

trigger:
  workflow_dispatch:
    inputs:
      variant:
        description: '选择要编译的版本'
        required: true
        default: 'team'
        type: choice
        options:
          - team
          - personal
      version_name:
        description: '版本号（可选，默认 1.0）'
        required: false
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: ① 拉取源码
        uses: actions/checkout@v4

      - name: ② 准备 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ③ 生成原生安卓工程
        run: |
          set -e
          VARIANT="${{ inputs.variant }}"
          if [ "$VARIANT" = "team" ]; then HTML="build_team.html"; else HTML="build_personal.html"; fi
          if [ ! -f "$HTML" ]; then
            echo "::error::仓库根目录未找到 $HTML，请确认已上传"
            exit 1
          fi
          mkdir -p native/assets native/gen
          cp "$HTML" native/assets/index.html
          echo "$VARIANT" > native/gen/variant.txt
          echo "${{ inputs.version_name }}" > native/gen/version.txt
          chmod +x native/build.sh
          ./native/build.sh

      - name: ④ 编译 APK
        run: |
          set -e
          cd native
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease
          else
            echo "::warning::未检测到 gradlew，改用 apkbuilder 直接打包"
            ./apk_pack.sh
          fi
          cd ..

      - name: ⑤ 签名
        run: |
          set -e
          cd native
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
              --ks keystore.jks \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --min-sdk-version 21 \
              --out app/build/outputs/apk/release/signed.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
            mv app/build/outputs/apk/release/signed.apk "白仓镇民政社工站_${{ inputs.variant }}版.apk"
          else
            echo "::notice::未配置签名密钥，使用 debug 签名（仅用于内测）"
            cp app/build/outputs/apk/debug/app-debug.apk "白仓镇民政社工站_${{ inputs.variant }}版.apk"
          fi
          cd ..
          ls -lh "白仓镇民政社工站_${{ inputs.variant }}版.apk"

      - name: ⑥ 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 白仓镇民政社工站_${{ inputs.variant }}版
          path: 白仓镇民政社工站_${{ inputs.variant }}版.apk
          retention-days: 30
